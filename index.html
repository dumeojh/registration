<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 환경설정</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
            color: #333;
            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-add {
            background-color: #34c759;
            color: white;
            margin-top: 5px;
        }

        .btn-save:hover,
        .btn-add:hover {
            opacity: 0.8;
        }

        .subject-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            border-top: 1px solid #eee;
        }

        .subject-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .delete-btn {
            color: #ff3b30;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid #ff3b30;
            padding: 2px 8px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h2>⚙️ 시스템 환경설정</h2>

        <div class="section">
            <span class="label">박람회 메인 타이틀</span>
            <input type="text" id="eventTitle" placeholder="예: 2026 교육과정 박람회">
            <button class="btn btn-save" onclick="updateTitle()">타이틀 저장</button>
        </div>

        <div class="section">
            <span class="label">새 과목 등록</span>
            <select id="category">
                <option value="국어">국어</option>
                <option value="수학">수학</option>
                <option value="영어">영어</option>
                <option value="사회">사회</option>
                <option value="과학">과학</option>
            </select>
            <input type="text" id="subjectName" placeholder="과목명을 입력하세요">
            <input type="number" id="credits" value="3" placeholder="단위 수">
            <button class="btn btn-add" onclick="addSubject()">과목 추가하기</button>
        </div>

        <div class="section">
            <span class="label">현재 등록된 과목 (조회)</span>
            <ul id="subjectList" class="subject-list">
            </ul>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



        // 페이지 시작 시 기존 설정 불러오기
        window.onload = async () => {
            loadTitle();
            loadSubjects();
        };

        // 타이틀 불러오기
        async function loadTitle() {
            const { data } = await supabase.from('system_config').select('value').eq('key', 'event_title').single();
            if (data) document.getElementById('eventTitle').value = data.value;
        }

        // 타이틀 수정 저장
        async function updateTitle() {
            const title = document.getElementById('eventTitle').value;
            const { error } = await supabase.from('system_config').upsert({ key: 'event_title', value: title });
            if (!error) alert('행사 타이틀이 변경되었습니다.');
        }

        // 과목 추가
        async function addSubject() {
            const category = document.getElementById('category').value;
            const subject_name = document.getElementById('subjectName').value;
            const credits = document.getElementById('credits').value;

            if (!subject_name) return alert('과목명을 입력해주세요.');

            const { error } = await supabase.from('subjects').insert([{ category, subject_name, credits }]);
            if (!error) {
                alert('과목이 등록되었습니다.');
                document.getElementById('subjectName').value = '';
                loadSubjects(); // 목록 새로고침
            }
        }

        // 과목 목록 불러오기
        async function loadSubjects() {
            const { data, error } = await supabase.from('subjects').select('*').order('category', { ascending: true });
            const listEl = document.getElementById('subjectList');
            listEl.innerHTML = '';

            if (data) {
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'subject-item';
                    li.innerHTML = `
                    <span>[${item.category}] <b>${item.subject_name}</b> (${item.credits}단위)</span>
                    <span class="delete-btn" onclick="deleteSubject(${item.id})">삭제</span>
                `;
                    listEl.appendChild(li);
                });
            }
        }

        // 과목 삭제
        async function deleteSubject(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const { error } = await supabase.from('subjects').delete().eq('id', id);
            if (!error) loadSubjects();
        }
    </script>

</body>

</html>
