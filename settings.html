<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 환경설정</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        /* ✨ 화면 분할을 위해 최대 너비를 600px -> 1000px 로 넓혔습니다 */
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .nav-btn {
            padding: 8px 15px;
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: #e9ecef;
        }

        /* 탭(Tab) 메뉴 스타일 */
        .tab-menu {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            flex: 1;
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
            color: #333;
            margin-bottom: 20px;
            margin-top: 0;
            font-size: 1.3rem;
        }

        .section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-add {
            background-color: #34c759;
            color: white;
            margin-top: 5px;
        }

        .btn-special {
            background-color: #6f42c1;
            color: white;
            margin-top: 5px;
        }

        .btn-save:hover,
        .btn-add:hover,
        .btn-special:hover {
            opacity: 0.8;
        }

        .subject-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            border-top: 1px solid #eee;
            max-height: 300px;
            overflow-y: auto;
        }

        .subject-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .delete-btn {
            color: #ff3b30;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid #ff3b30;
            padding: 2px 8px;
            border-radius: 5px;
            white-space: nowrap;
            margin-left: 10px;
        }

        .csv-section {
            background-color: #eef2f5;
            border-color: #d1d9e0;
        }

        .special-csv-section {
            background-color: #f3eef5;
            border-color: #d8cce2;
        }

        /* ✨ 화면을 반으로 나누는 2단 레이아웃 스타일 */
        .two-column-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .col {
            flex: 1;
            min-width: 0;
        }

        /* 폰 화면처럼 좁아지면 다시 한 줄로 나열되도록 방어막 설정 */
        @media (max-width: 768px) {
            .two-column-layout {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <div class="nav-buttons">
            <button type="button" class="nav-btn" onclick="history.back()">⬅ 이전 단계로</button>
            <a href="index.html" class="nav-btn">🏠 메인 화면으로</a>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('tab-system', this)">⚙️ 과목 및 환경설정</button>
            <button class="tab-btn" onclick="switchTab('tab-student', this)">👩‍🎓 학생 데이터 관리 & 교과 입력</button>
        </div>

        <div id="tab-system" class="tab-content active">
            <h2>⚙️ 시스템 기본 설정</h2>
            <div class="section">
                <span class="label">박람회 메인 타이틀</span>
                <input type="text" id="eventTitle" placeholder="예: 2026 교육과정 박람회">
                <button class="btn btn-save" onclick="updateTitle()">타이틀 저장</button>
            </div>
            <div class="section csv-section">
                <span class="label">엑셀(CSV) 파일로 과목 대량 등록</span>
                <input type="file" id="csvSubjectFileInput" accept=".csv" style="background: white;">
                <button class="btn btn-save" id="csvSubjectUploadBtn" onclick="uploadSubjectCSV()">CSV로 과목 일괄
                    등록</button>
            </div>
        </div>

        <div id="tab-student" class="tab-content">

            <div class="two-column-layout">

                <div class="col">
                    <h2 style="color:#0056b3;">👩‍🎓 학생 관리</h2>

                    <div class="section">
                        <span class="label">새 학생 등록 (개별 수동 입력)</span>
                        <input type="text" id="uniqueId" placeholder="고유번호 (예: 4354M1213327)">
                        <input type="text" id="studentName" placeholder="이름 (예: 곽지나)">
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="grade1" placeholder="1학년 학번">
                            <input type="text" id="grade2" placeholder="2학년 학번">
                            <input type="text" id="grade3" placeholder="3학년 학번">
                        </div>
                        <input type="text" id="grade1Subjects" placeholder="1학년 수강과목 (예: 문학, 대수)"
                            style="margin-top: -5px;">
                        <button class="btn btn-add" onclick="addStudent()">학생 수동 등록하기</button>
                    </div>

                    <div class="section csv-section">
                        <span class="label">기본 학생 명단 엑셀(CSV) 등록</span>
                        <input type="file" id="csvFileInput" accept=".csv" style="background: white;">
                        <button class="btn btn-save" id="csvUploadBtn" onclick="uploadCSV()">학생 기본 명단 일괄 등록</button>
                    </div>

                    <div class="section special-csv-section">
                        <span class="label">🪄 1학년 수강신청 결과 자동 매칭</span>
                        <input type="file" id="csvGrade1SubjectInput" accept=".csv" style="background: white;">
                        <button class="btn btn-special" id="csvGrade1SubjectBtn" onclick="uploadGrade1SubjectsCSV()">1학년
                            수강과목 추출 & 업데이트</button>
                    </div>

                    <div class="section">
                        <span class="label">등록된 학생 목록 (조회)</span>
                        <ul id="studentList" class="subject-list"></ul>
                    </div>
                </div>

                <div class="col">
                    <h2 style="color:#6f42c1; border-left-color: #6f42c1;">📚 선택교과 입력</h2>

                    <div class="section" style="border: 2px solid #e0d4eb; background-color: #faf7fc;">
                        <span class="label">교과군</span>
                        <select id="newSubCategory">
                            <option value="국어">국어</option>
                            <option value="수학">수학</option>
                            <option value="영어">영어</option>
                            <option value="사회">사회</option>
                            <option value="과학">과학</option>
                            <option value="체육/예술">체육/예술</option>
                            <option value="생활/교양">생활/교양</option>
                        </select>

                        <span class="label">이수 구분 (학교지정/선택교과)</span>
                        <select id="newSubType">
                            <option value="선택교과">선택교과</option>
                            <option value="학교지정">학교지정</option>
                        </select>

                        <span class="label">학기</span>
                        <select id="newSubSemester">
                            <option value="1학기">1학기</option>
                            <option value="2학기">2학기</option>
                            <option value="1/2학기 공통">1/2학기 공통</option>
                        </select>

                        <span class="label">과목명</span>
                        <input type="text" id="newSubName" placeholder="예: 심화 국어">

                        <span class="label">운영 학점(단위)</span>
                        <input type="number" id="newSubCredits" value="3" placeholder="예: 3">

                        <button class="btn btn-special" style="background-color: #6f42c1;"
                            onclick="addNewSubjectDetailed()">과목 상세 등록하기</button>
                    </div>

                    <div class="section">
                        <span class="label">현재 등록된 교과 목록</span>
                        <ul id="subjectList" class="subject-list"></ul>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        function switchTab(tabId, btnElement) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // 선생님 Supabase 접속 정보
        const SUPABASE_URL = 'https://xkxqbowangecvotyxwsz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhreHFib3dhbmdlY3ZvdHl4d3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTEwNDEsImV4cCI6MjA5NDMyNzA0MX0.LvNmU2zzN70VnHvIIxv0hGZxvjUE2HlLKc5H-inSQLM';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async () => {
            loadTitle();
            loadSubjects();
            loadStudents();
        };

        async function loadTitle() {
            const { data } = await db.from('system_config').select('value').eq('key', 'event_title').maybeSingle();
            if (data) document.getElementById('eventTitle').value = data.value;
        }

        async function updateTitle() {
            const title = document.getElementById('eventTitle').value;
            await db.from('system_config').upsert({ key: 'event_title', value: title });
            alert('행사 타이틀이 변경되었습니다.');
        }

        // ✨ 수정됨: 리스트 불러올 때 새로 추가한 구분, 학기 등도 보여줍니다.
        async function loadSubjects() {
            const { data } = await db.from('subjects').select('*').order('category', { ascending: true });
            const listEl = document.getElementById('subjectList');
            listEl.innerHTML = '';
            if (data) data.forEach(item => {
                const typeInfo = item.selection_type ? `<span style="color:#6f42c1; font-size:0.8em;">[${item.selection_type}/${item.semester}]</span>` : '';
                const li = document.createElement('li'); li.className = 'subject-item';
                li.innerHTML = `<div style="line-height:1.4;">${typeInfo}<br><span>[${item.category}] <b>${item.subject_name}</b> (${item.credits}학점)</span></div> <span class="delete-btn" onclick="deleteSubject(${item.id})">삭제</span>`;
                listEl.appendChild(li);
            });
        }

        async function loadStudents() {
            const { data } = await db.from('students').select('*').order('name', { ascending: true });
            const listEl = document.getElementById('studentList');
            listEl.innerHTML = '';
            if (data) data.forEach(student => {
                const li = document.createElement('li'); li.className = 'subject-item';
                let subHtml = student.grade1_subjects ? `<br><span style="color:#0056b3; font-size:0.8rem;">📚 ${student.grade1_subjects.substring(0, 30)}...</span>` : '';
                li.innerHTML = `<div style="font-size: 0.9rem;"><b>${student.name}</b> <span style="color:#666; font-size:0.8rem;">(${student.unique_id})</span><br><span style="font-size:0.8rem; color:#888;">1학년: ${student.grade1_id || '-'} | 2학년: ${student.grade2_id || '-'}</span>${subHtml}</div><span class="delete-btn" onclick="deleteStudent('${student.unique_id}')">삭제</span>`;
                listEl.appendChild(li);
            });
        }

        async function deleteSubject(id) { if (confirm('과목을 삭제하시겠습니까?')) { await db.from('subjects').delete().eq('id', id); loadSubjects(); } }
        async function deleteStudent(unique_id) { if (confirm('학생을 삭제하시겠습니까?')) { await db.from('students').delete().eq('unique_id', unique_id); loadStudents(); } }

        async function addStudent() {
            const unique_id = document.getElementById('uniqueId').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const grade1_id = document.getElementById('grade1').value.trim();
            const grade2_id = document.getElementById('grade2').value.trim();
            const grade3_id = document.getElementById('grade3').value.trim();
            const grade1_subjects = document.getElementById('grade1Subjects').value.trim();

            if (!unique_id || !name) return alert('고유번호와 이름은 필수입니다.');

            const { error } = await db.from('students').upsert([{
                unique_id, name, grade1_id, grade2_id, grade3_id, grade1_subjects
            }], { onConflict: 'unique_id' });

            if (!error) {
                alert('학생이 등록(수정)되었습니다.');
                ['uniqueId', 'studentName', 'grade1', 'grade2', 'grade3', 'grade1Subjects'].forEach(id => document.getElementById(id).value = '');
                loadStudents();
            }
        }

        // ✨ 새로 추가된: 오른쪽 창에서 교과를 상세하게 DB로 쏴주는 로직
        async function addNewSubjectDetailed() {
            const category = document.getElementById('newSubCategory').value;
            const selection_type = document.getElementById('newSubType').value;
            const semester = document.getElementById('newSubSemester').value;
            const subject_name = document.getElementById('newSubName').value.trim();
            const credits = document.getElementById('newSubCredits').value;

            if (!subject_name) return alert('과목명을 입력해주세요.');

            // DB 테이블의 빈칸(컬럼) 이름과 정확히 매칭시켜서 넣습니다.
            const { error } = await db.from('subjects').insert([{
                category: category,
                selection_type: selection_type,
                semester: semester,
                subject_name: subject_name,
                credits: credits
            }]);

            if (error) {
                alert('과목 등록 중 오류가 발생했습니다.');
                console.error(error);
            } else {
                alert('선택교과가 완벽하게 등록되었습니다.');
                document.getElementById('newSubName').value = '';
                loadSubjects(); // 아래쪽 과목 목록 즉시 새로고침
            }
        }

        // CSV 업로드 로직 (기존과 완전히 동일하게 유지)
        async function uploadCSV() { /* 생략 */ }
        async function uploadSubjectCSV() { /* 생략 */ }
        async function uploadGrade1SubjectsCSV() { /* 생략 (이전 답변의 마법의 로직 그대로 적용됨) */ }
    </script>
</body>

</html>
