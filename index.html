<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 환경설정</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
            color: #333;
            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-add {
            background-color: #34c759;
            color: white;
            margin-top: 5px;
        }

        .btn-save:hover,
        .btn-add:hover {
            opacity: 0.8;
        }

        .subject-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            border-top: 1px solid #eee;
            max-height: 300px;
            /* 목록이 너무 길어지면 스크롤 생성 */
            overflow-y: auto;
        }

        .subject-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .delete-btn {
            color: #ff3b30;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid #ff3b30;
            padding: 2px 8px;
            border-radius: 5px;
            white-space: nowrap;
            margin-left: 10px;
        }

        /* 엑셀 업로드 섹션 스타일 */
        .csv-section {
            background-color: #eef2f5;
            border-color: #d1d9e0;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h2>⚙️ 시스템 환경설정</h2>

        <div class="section">
            <span class="label">박람회 메인 타이틀</span>
            <input type="text" id="eventTitle" placeholder="예: 2026 교육과정 박람회">
            <button class="btn btn-save" onclick="updateTitle()">타이틀 저장</button>
        </div>

        <div class="section">
            <span class="label">새 과목 등록</span>
            <select id="category">
                <option value="국어">국어</option>
                <option value="수학">수학</option>
                <option value="영어">영어</option>
                <option value="사회">사회</option>
                <option value="과학">과학</option>
            </select>
            <input type="text" id="subjectName" placeholder="과목명을 입력하세요">
            <input type="number" id="credits" value="3" placeholder="단위 수">
            <button class="btn btn-add" onclick="addSubject()">과목 추가하기</button>
        </div>

        <div class="section">
            <span class="label">현재 등록된 과목 (조회)</span>
            <ul id="subjectList" class="subject-list"></ul>
        </div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px dashed #ccc;">

        <h2>👩‍🎓 학생 데이터 관리</h2>

        <div class="section">
            <span class="label">새 학생 등록 (개별)</span>
            <input type="text" id="uniqueId" placeholder="고유번호 (예: 4354M1213327)">
            <input type="text" id="studentName" placeholder="이름 (예: 곽지나)">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="grade1" placeholder="1학년 학번">
                <input type="text" id="grade2" placeholder="2학년 학번">
                <input type="text" id="grade3" placeholder="3학년 학번">
            </div>
            <button class="btn btn-add" onclick="addStudent()">학생 등록하기</button>
        </div>

        <div class="section csv-section">
            <span class="label">엑셀(CSV) 파일로 대량 등록</span>
            <p style="font-size: 0.8rem; color: #666; margin-top: 0;">
                ※ 엑셀에서 <b>'CSV UTF-8 (쉼표로 분리)'</b> 형식으로 저장한 파일만 업로드 가능합니다.<br>
                ※ 첫 줄(헤더)은 반드시 <b>학번1, 학번2, 학번3, 이름, 고유번호</b>로 되어 있어야 합니다.
            </p>
            <input type="file" id="csvFileInput" accept=".csv" style="background: white;">
            <button class="btn btn-save" id="csvUploadBtn" onclick="uploadCSV()">CSV로 일괄 등록 및 업데이트</button>
        </div>

        <div class="section">
            <span class="label">등록된 학생 목록 (조회)</span>
            <ul id="studentList" class="subject-list"></ul>
        </div>

    </div>

    <script>
        // ★여기에 선생님의 Supabase 정보를 입력하세요★
        const SUPABASE_URL = 'https://xkxqbowangecvotyxwsz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhreHFib3dhbmdlY3ZvdHl4d3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTEwNDEsImV4cCI6MjA5NDMyNzA0MX0.LvNmU2zzN70VnHvIIxv0hGZxvjUE2HlLKc5H-inSQLM';

        // 변수 이름을 supabase 대신 db로 변경하여 충돌을 막습니다.
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 페이지 시작 시 기존 설정 및 데이터 불러오기
        window.onload = async () => {
            loadTitle();
            loadSubjects();
            loadStudents();
        };

        // ==========================================
        // 1. 타이틀 및 과목 관리 로직
        // ==========================================

        async function loadTitle() {
            const { data } = await db.from('system_config').select('value').eq('key', 'event_title').single();
            if (data) document.getElementById('eventTitle').value = data.value;
        }

        async function updateTitle() {
            const title = document.getElementById('eventTitle').value;
            const { error } = await db.from('system_config').upsert({ key: 'event_title', value: title });
            if (!error) alert('행사 타이틀이 변경되었습니다.');
        }

        async function addSubject() {
            const category = document.getElementById('category').value;
            const subject_name = document.getElementById('subjectName').value;
            const credits = document.getElementById('credits').value;

            if (!subject_name) return alert('과목명을 입력해주세요.');

            const { error } = await db.from('subjects').insert([{ category, subject_name, credits }]);
            if (!error) {
                alert('과목이 등록되었습니다.');
                document.getElementById('subjectName').value = '';
                loadSubjects();
            }
        }

        async function loadSubjects() {
            const { data, error } = await db.from('subjects').select('*').order('category', { ascending: true });
            const listEl = document.getElementById('subjectList');
            listEl.innerHTML = '';

            if (data) {
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'subject-item';
                    li.innerHTML = `
                    <span>[${item.category}] <b>${item.subject_name}</b> (${item.credits}단위)</span>
                    <span class="delete-btn" onclick="deleteSubject(${item.id})">삭제</span>
                `;
                    listEl.appendChild(li);
                });
            }
        }

        async function deleteSubject(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const { error } = await db.from('subjects').delete().eq('id', id);
            if (!error) loadSubjects();
        }

        // ==========================================
        // 2. 학생 데이터 관리 로직
        // ==========================================

        async function addStudent() {
            const unique_id = document.getElementById('uniqueId').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const grade1_id = document.getElementById('grade1').value.trim();
            const grade2_id = document.getElementById('grade2').value.trim();
            const grade3_id = document.getElementById('grade3').value.trim();

            if (!unique_id || !name) {
                return alert('고유번호와 이름은 반드시 입력해야 합니다.');
            }

            const { error } = await db.from('students').insert([{
                unique_id,
                name,
                grade1_id,
                grade2_id,
                grade3_id
            }]);

            if (error) {
                alert('등록 중 오류가 발생했습니다. 고유번호가 중복되었는지 확인해주세요.');
                console.error(error);
            } else {
                alert('학생이 성공적으로 등록되었습니다.');
                document.getElementById('uniqueId').value = '';
                document.getElementById('studentName').value = '';
                document.getElementById('grade1').value = '';
                document.getElementById('grade2').value = '';
                document.getElementById('grade3').value = '';
                loadStudents();
            }
        }

        async function loadStudents() {
            const { data, error } = await db.from('students').select('*').order('name', { ascending: true });
            const listEl = document.getElementById('studentList');
            listEl.innerHTML = '';

            if (data) {
                data.forEach(student => {
                    const li = document.createElement('li');
                    li.className = 'subject-item';
                    li.innerHTML = `
                        <div style="font-size: 0.9rem;">
                            <b>${student.name}</b> <span style="color:#666; font-size:0.8rem;">(${student.unique_id})</span><br>
                            <span style="font-size:0.8rem; color:#888;">
                                1학년: ${student.grade1_id || '-'} | 
                                2학년: ${student.grade2_id || '-'} | 
                                3학년: ${student.grade3_id || '-'}
                            </span>
                        </div>
                        <span class="delete-btn" onclick="deleteStudent('${student.unique_id}')">삭제</span>
                    `;
                    listEl.appendChild(li);
                });
            }
        }

        async function deleteStudent(unique_id) {
            if (!confirm('정말 이 학생의 데이터를 삭제하시겠습니까?')) return;
            const { error } = await db.from('students').delete().eq('unique_id', unique_id);
            if (!error) {
                loadStudents();
            } else {
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];

            if (!file) {
                return alert('업로드할 CSV 파일을 먼저 선택해주세요.');
            }

            const uploadBtn = document.getElementById('csvUploadBtn');
            const originalBtnText = uploadBtn.innerText;
            uploadBtn.innerText = '데이터 업로드 중... ⏳';
            uploadBtn.disabled = true;

            const reader = new FileReader();

            reader.onload = async function (e) {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);

                    if (lines.length < 2) {
                        throw new Error('데이터가 없거나 파일 형식이 잘못되었습니다.');
                    }

                    const headers = lines[0].split(',').map(h => h.trim());
                    const idxGrade1 = headers.indexOf('학번1');
                    const idxGrade2 = headers.indexOf('학번2');
                    const idxGrade3 = headers.indexOf('학번3');
                    const idxName = headers.indexOf('이름');
                    const idxUniqueId = headers.indexOf('고유번호');

                    if (idxName === -1 || idxUniqueId === -1) {
                        throw new Error('CSV 첫 줄에 "이름"과 "고유번호" 열이 반드시 있어야 합니다.');
                    }

                    const studentsToInsert = [];

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const cols = line.split(',').map(c => c.trim());

                        if (!cols[idxUniqueId] || !cols[idxName]) continue;

                        studentsToInsert.push({
                            unique_id: cols[idxUniqueId],
                            name: cols[idxName],
                            grade1_id: cols[idxGrade1] || null,
                            grade2_id: cols[idxGrade2] || null,
                            grade3_id: cols[idxGrade3] || null
                        });
                    }

                    // 여기도 db.from으로 변경
                    const { error } = await db.from('students').upsert(studentsToInsert, { onConflict: 'unique_id' });

                    if (error) {
                        console.error(error);
                        throw new Error('데이터베이스 저장 중 오류가 발생했습니다.');
                    }

                    alert(`총 ${studentsToInsert.length}명의 학생 데이터가 성공적으로 처리되었습니다!`);
                    fileInput.value = '';
                    loadStudents();

                } catch (error) {
                    alert(error.message);
                } finally {
                    uploadBtn.innerText = originalBtnText;
                    uploadBtn.disabled = false;
                }
            };

            // UTF-8 형식으로 읽기 (한글 깨짐 방지)
            reader.readAsText(file, 'utf-8');
        }
    </script>
</body>

</html>
