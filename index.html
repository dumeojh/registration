<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 2026 교육과정 박람회</title>
    <style>
        /* 기본 배경 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 10px;
            font-size: 1.8em;
            word-break: keep-all;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        /* 카드 버튼들을 감싸는 영역 */
        .card-container {
            display: flex;
            flex-direction: column;
            /* 모바일에서는 세로 배치 */
            gap: 20px;
        }

        /* 화면이 넓어지면(태블릿/PC) 가로 배치로 변경 */
        @media (min-width: 500px) {
            .card-container {
                flex-direction: row;
            }
        }

        /* 개별 카드 디자인 */
        .card {
            background: #ffffff;
            border-radius: 15px;
            padding: 40px 20px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #0056b3;
        }

        .icon {
            font-size: 3.5em;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 1.4em;
        }

        .card p {
            margin: 0;
            font-size: 0.95em;
            color: #777;
            word-break: keep-all;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>안성여고 2026 교육과정 박람회</h1>
        <p class="subtitle">원하시는 접속 메뉴를 선택해 주세요.</p>
