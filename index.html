

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 수강신청 조회 시스템</title>
    <!-- Tailwind CSS CDN (반응형 디자인을 위해 사용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Noto+Sans+KR', sans-serif; background-color: #f3f4f6; }
        .card { transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- 헤더 섹션 -->
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-800">안성여고 수강신청 결과 조회</h1>
            <p class="text-gray-600 text-sm mt-2">학번 또는 이름을 입력하여 본인의 수강신청 내역을 확인하세요.</p>
        </header>

        <!-- 검색 섹션 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <div class="flex flex-col gap-3">
                <input type="text" id="searchInput" placeholder="예: 10101 또는 홍길동" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button onclick="handleSearch()" id="searchButton"
                        class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:bg-blue-800 transition-colors">
                    조회하기
                </button>
            </div>
        </div>

        <!-- 결과 표시 섹션 (기본적으로 숨김) -->
        <div id="resultArea" class="hidden space-y-4">
            <!-- 학생 기본 정보 카드 -->
            <div class="bg-blue-50 rounded-2xl p-6 border border-blue-100">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 id="studentName" class="text-xl font-bold text-gray-800">홍길동</h2>
                        <p id="studentId" class="text-blue-600 font-medium">10101</p>
                    </div>
                    <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold">
                        <!-- 상태 배지 (정상/확인필요) -->
                    </div>
                </div>
            </div>

            <!-- 경고 메시지 (필수 이수 학점 부족 시) -->
            <div id="warningBox" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
                <div class="flex">
                    <div class="flex-shrink-0 text-red-500">⚠️</div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700 font-bold">사회 교과 필수 이수 학점 확인 필요</p>
                        <p class="text-xs text-red-600 mt-1">3학년 수강신청 시 사회 과목을 반드시 1과목 이상 선택해야 합니다.</p>
                    </div>
                </div>
            </div>

            <!-- 과목 리스트 -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="bg-gray-50 px-6 py-3 border-b border-gray-100">
                    <h3 class="text-sm font-bold text-gray-700">신청 과목 내역</h3>
                </div>
                <ul id="courseList" class="divide-y divide-gray-100">
                    <!-- 과목 리스트 아이템이 여기에 추가됩니다 -->
                </ul>
            </div>
        </div>

        <!-- 초기 화면 또는 로딩/에러 메시지 -->
        <div id="messageArea" class="text-center py-12 text-gray-400">
            조회 결과가 여기에 표시됩니다.
        </div>
    </div>

    <script>
        // --- 설정 섹션 (선택: 수파베이스 연결 정보 입력) ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // ---------------------------------------------

        async function handleSearch() {
            const searchInput = document.getElementById('searchInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const messageArea = document.getElementById('messageArea');
            const searchButton = document.getElementById('searchButton');

            if (!searchInput) {
                alert('학번이나 이름을 입력해주세요.');
                return;
            }

            // 로딩 상태 표시
            searchButton.disabled = true;
            searchButton.innerText = '조회 중...';
            
            try {
                // 1. 수파베이스에서 데이터 가져오기 (registrations 테이블)
                // 실제 구현 시에는 students 테이블과 조인하거나 registrations 테이블을 검색합니다.
                const { data, error } = await supabase
                    .from('registrations')
                    .select('*')
                    .or(`student_id.eq.${searchInput},name.eq.${searchInput}`);

                if (error) throw error;

                if (data && data.length > 0) {
                    displayResults(data);
                } else {
                    showError('검색 결과가 없습니다. 정보를 다시 확인해주세요.');
                }
            } catch (err) {
                console.error(err);
                // 테스트를 위해 데이터가 없는 경우 가이드 메시지 (선생님 확인용)
                showError('수파베이스 연결 설정(URL/Key)이 필요합니다. 개발자 도구를 확인하세요.');
            } finally {
                searchButton.disabled = false;
                searchButton.innerText = '조회하기';
            }
        }

        function displayResults(data) {
            const resultArea = document.getElementById('resultArea');
            const messageArea = document.getElementById('messageArea');
            const courseList = document.getElementById('courseList');
            const warningBox = document.getElementById('warningBox');
            const statusBadge = document.getElementById('statusBadge');

            // 기본 정보 세팅
            document.getElementById('studentName').innerText = data[0].name;
            document.getElementById('studentId').innerText = data[0].student_id;

            // 리스트 초기화
            courseList.innerHTML = '';
            
            // 사회 과목 이수 학점 체크 (예시 로직: 사회 과목이 없으면 경고)
            const hasSocial = data.some(item => item.category === '사회');
            
            if (!hasSocial) {
                warningBox.classList.remove('hidden');
                statusBadge.innerText = '확인 필요';
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600';
            } else {
                warningBox.classList.add('hidden');
                statusBadge.innerText = '정상';
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-600';
            }

            // 과목 추가
            data.forEach(item => {
                const li = document.createElement('li');
                li.className = 'px-6 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors';
                li.innerHTML = `
                    <div>
                        <p class="text-xs text-gray-500 font-medium">${item.category}</p>
                        <p class="text-gray-800 font-bold">${item.course_name}</p>
                    </div>
                    <span class="text-sm font-bold text-blue-600">${item.credits || 3}학점</span>
                `;
                courseList.appendChild(li);
            });

            messageArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
        }

        function showError(msg) {
            const resultArea = document.getElementById('resultArea');
            const messageArea = document.getElementById('messageArea');
            messageArea.innerText = msg;
            messageArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
        }

        // 엔터키 검색 지원
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
