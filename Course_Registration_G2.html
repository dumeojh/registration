<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 수강신청 정보 조회</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 기본 스타일 유지 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            /* 가로 배치를 위해 창 너비를 살짝 넓혔습니다 */
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .nav-btn {
            padding: 8px 15px;
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: #e9ecef;
        }

        .print-btn {
            margin-left: auto;
            background-color: #e2ece9;
            font-weight: bold;
            color: #155724;
            border-color: #c3e6cb;
        }

        h1 {
            color: #0056b3;
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 30px;
        }

        .search-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        /* 입력칸 가로 배치용 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background-color: #004494;
        }

        /* 결과 창 기본 설정 */
        #resultArea {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #c3e6cb;
            background-color: #f0fdf4;
            border-radius: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        /* ✨ 정보 가로 배치 (그리드) 설정 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* 4칸으로 일정하게 나눔 */
            gap: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .info-box {
            background: #ffffff;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .result-label {
            font-size: 0.85em;
            color: #155724;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .result-value {
            font-size: 1.15em;
            font-weight: bold;
            color: #000;
            word-break: break-all;
        }

        /* 수강과목 영역 설정 */
        .subject-area {
            border-top: 1px dashed #c3e6cb;
            padding-top: 20px;
        }

        .subject-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .subject-tag {
            background-color: #e2ece9;
            color: #0056b3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: normal;
            border: 1px solid #c8d8d3;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 모바일에서는 2줄(2x2)로 자동 변환 */
        @media (max-width: 500px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .input-group {
                flex-direction: column;
            }

            /* 모바일은 입력칸 세로로 */
        }

        @media print {

            .nav-buttons,
            .search-box,
            .action-btn {
                display: none !important;
            }

            body {
                padding: 0;
                background-color: white;
            }

            .container {
                box-shadow: none;
                border: none;
                max-width: 100%;
            }

            #resultArea {
                display: block !important;
                border: 1px solid #000;
                background: white;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="nav-buttons">
            <button type="button" class="nav-btn" onclick="history.back()">⬅ 이전 단계로</button>
            <a href="index.html" class="nav-btn">🏠 메인 화면으로</a>
            <button type="button" class="nav-btn print-btn" onclick="window.print()">🖨️ 정보 인쇄</button>
        </div>

        <h1>2학년 수강신청 정보 조회</h1>

        <div class="search-box">
            <label>학번과 이름을 모두 입력하세요</label>
            <div class="input-group">
                <input type="text" id="studentIdInput" placeholder="2학년 학번 (예: 20315)" maxlength="5">
                <input type="text" id="studentNameInput" placeholder="이름 (예: 황경서)">
            </div>
            <button class="action-btn" onclick="searchStudent()">학생 정보 조회하기</button>
        </div>

        <div id="resultArea">
            <div class="info-grid">
                <div class="info-box">
                    <div class="result-label">이름</div>
                    <div id="resName" class="result-value">-</div>
                </div>
                <div class="info-box">
                    <div class="result-label">1학년 학번</div>
                    <div id="resGrade1" class="result-value">-</div>
                </div>
                <div class="info-box">
                    <div class="result-label">2학년 학번</div>
                    <div id="resGrade2" class="result-value">-</div>
                </div>
                <div class="info-box">
                    <div class="result-label">학생 고유번호</div>
                    <div id="resUniqueId" class="result-value">-</div>
                </div>
            </div>

            <div class="subject-area">
                <div class="result-label" style="font-size: 1em;">📚 1학년 수강 신청 과목</div>
                <div id="resSubjects" class="result-value subject-tags"></div>
            </div>
        </div>
    </div>

    <script>
        // 선생님의 Supabase 접속 정보
        const SUPABASE_URL = 'https://xkxqbowangecvotyxwsz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhreHFib3dhbmdlY3ZvdHl4d3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTEwNDEsImV4cCI6MjA5NDMyNzA0MX0.LvNmU2zzN70VnHvIIxv0hGZxvjUE2HlLKc5H-inSQLM';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function searchStudent() {
            // 학번과 이름 두 가지를 모두 가져옵니다.
            const idVal = document.getElementById('studentIdInput').value.trim();
            const nameVal = document.getElementById('studentNameInput').value.trim();
            const resultArea = document.getElementById('resultArea');

            // 둘 중 하나라도 입력하지 않으면 안내 메시지 띄움
            if (!idVal || !nameVal) {
                alert("조회할 학번과 이름을 모두 입력해 주세요.");
                return;
            }

            try {
                // ✨ DB에서 2학년 학번과 이름이 '모두' 일치하는 데이터를 찾습니다.
                const { data, error } = await db
                    .from('students')
                    .select('name, grade1_id, grade2_id, unique_id, grade1_subjects')
                    .eq('grade2_id', idVal)
                    .eq('name', nameVal)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    // 가로 4칸에 각각 데이터 채워넣기
                    document.getElementById('resName').innerText = data.name;
                    document.getElementById('resGrade1').innerText = data.grade1_id || "-";
                    document.getElementById('resGrade2').innerText = data.grade2_id || "-";
                    document.getElementById('resUniqueId').innerText = data.unique_id || "-";

                    const subjectsArea = document.getElementById('resSubjects');
                    if (data.grade1_subjects && data.grade1_subjects.trim() !== '') {
                        const subjectArray = data.grade1_subjects.split(',');
                        subjectsArea.innerHTML = subjectArray.map(sub => `<span class="subject-tag">${sub.trim()}</span>`).join('');
                    } else {
                        subjectsArea.innerHTML = '<span style="font-size:0.9em; color:#888; font-weight:normal;">등록된 수강 신청 데이터가 없습니다.</span>';
                    }

                    resultArea.style.display = 'block';
                } else {
                    alert("입력하신 학번과 이름이 일치하는 학생 정보를 찾을 수 없습니다.");
                    resultArea.style.display = 'none';
                }
            } catch (err) {
                console.error("조회 중 오류:", err);
                alert("데이터 조회 중 오류가 발생했습니다.");
            }
        }

        // 엔터키를 치면 자동으로 검색되게 하는 기능 (학번, 이름 칸 모두 적용)
        document.getElementById('studentIdInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchStudent();
        });
        document.getElementById('studentNameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchStudent();
        });
    </script>
</body>

</html>
