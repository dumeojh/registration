<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 2026 교육과정 박람회</title>
    <style>
        /* 기본 배경 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 10px;
            font-size: 1.8em;
            word-break: keep-all;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        /* 카드 버튼들을 감싸는 영역 */
        .card-container {
            display: flex;
            flex-direction: column;
            /* 모바일에서는 세로 배치 */
            gap: 20px;
        }

        /* 화면이 넓어지면(태블릿/PC) 가로 2개씩 배치되도록 변경 */
        @media (min-width: 600px) {
            .card-container {
                flex-direction: row;
                flex-wrap: wrap;
                /* 카드가 4개이므로 공간이 부족하면 다음 줄로 넘어감 */
                justify-content: center;
            }

            .card {
                /* 한 줄에 2개씩 들어가도록 너비 조정 */
                flex: 1 1 calc(50% - 20px);
                max-width: 400px;
            }
        }

        /* 개별 카드 디자인 */
        .card {
            background: #ffffff;
            border-radius: 15px;
            padding: 40px 20px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            box-sizing: border-box;
            /* 패딩이 너비에 포함되도록 설정 */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #0056b3;
        }

        .icon {
            font-size: 3.5em;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 1.4em;
        }

        .card p {
            margin: 0;
            font-size: 0.95em;
            color: #777;
            word-break: keep-all;
            line-height: 1.4;
        }
    </style>
</head>

<body>

        <p class="subtitle">원하시는 접속 메뉴를 선택해 주세요.</p>

        <div class="card-container">
            <a href="Educational_Planning_G1.html" class="card">
                <div class="icon">🌱</div>

                <p>고교 생활의 시작! 나만의 교육과정을 그려보세요.</p>
            </a>

            <a href="Educational_Planning_G2.html" class="card">
                <div class="icon">📘</div>
                <h2>2학년 학업설계서(2025년 입학생)</h2>
                <p>전공 심화와 진로 구체화를 위한 과목을 선택하세요.</p>
            </a>

            <a href="https://dumeojh.github.io/high/" class="card" target="_blank" rel="noopener noreferrer">
                <div class="icon">🔗</div>
                <h2>고교학점제 안내</h2>
                <p>관련 홈페이지로 이동하여 추가 정보를 확인하세요.</p>
            </a>

            <a href="settings.html" class="card">
                <div class="icon">⚙️</div>
                <h2>시스템 환경설정</h2>
                <p>과목 및 학생 데이터를 관리하는 관리자 전용 메뉴입니다.</p>
            </a>
        </div>
    </div>

</body>

</html>
